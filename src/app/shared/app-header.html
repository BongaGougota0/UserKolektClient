<header class="header">
    <div class="container header-content">
        <div class="app-details">
            <h1 class="logo">UserKolekt</h1>
            <p class="description">learnig reactive applications development.</p>
        </div>
        <nav class="auth-nav">
            @if(isAuthenticated) {
                <button (click)="navigate('/')" class="btn btn-outline hidden" id="logoutBtn">Logout</button>
            } @else {
                <button (click)="navigate('/login')" class="btn btn-outline" id="loginBtn">Login</button>
                <button (click)="navigate('/register')" class="btn btn-primary" id="signupBtn">Sign Up</button>
            }
        </nav>
    </div>
</header>
