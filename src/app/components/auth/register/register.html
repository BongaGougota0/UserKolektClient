<div class="auth__container">
  <div class="auth__header">
    <h1 class="auth__title">Create Account</h1>
    <p class="auth__subtitle">Join us today</p>
  </div>

  <form class="auth__form">
    <div class="auth__form-group">
      <label for="email" class="auth__label">Email</label>
      <input type="email" id="email" class="auth__input" placeholder="Enter your email" required />
    </div>

    <div class="auth__form-group">
      <label for="username" class="auth__label">Username</label>
      <input
        type="text"
        id="username"
        class="auth__input"
        placeholder="Choose a username"
        required
      />
    </div>

    <div class="auth__form-group">
      <label for="password" class="auth__label">Password</label>
      <input
        type="password"
        id="password"
        class="auth__input"
        placeholder="Create a password"
        required
      />
    </div>

    <button type="submit" class="auth__button">Register</button>
  </form>

  <div class="auth__divider">or</div>

  <div class="auth__links">
    <a href="login" class="auth__link">Already have an account? Login</a>
    <a href="/" class="auth__home-link">← Back to Home</a>
  </div>
</div>
